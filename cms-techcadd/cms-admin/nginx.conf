server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets — safe to cache forever.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy /api and /uploads to the CMS API container.
    # This keeps the browser on the same origin (cms.domain) so session
    # cookies work with sameSite=lax — no need for sameSite=none + HTTPS.
    #
    # The upstream name is "cms-api-hoshiarpur", not the bare "cms-api" every
    # other city's frontend also resolves: every techcadd-<city> stack shares
    # one Coolify Docker network, and Docker's embedded DNS round-robins
    # across every container registered under the same network alias. With
    # every city's backend aliased "cms-api", this frontend would randomly be
    # proxied to a different city's API — a different session store and a
    # different COOKIE_SECRET — which reads as "randomly signed out". The
    # Coolify app's own Networking → Network aliases must match this name.
    #
    # The upstream is held in a variable and resolved through Docker's
    # embedded DNS (127.0.0.11) at request time. A literal hostname in
    # proxy_pass is resolved once when nginx starts and never again, so any
    # API redeploy (new container, new IP) after this frontend booted left
    # nginx proxying to the dead IP: every /api call returned 502 ("Host is
    # unreachable") until the frontend was restarted by hand. With a variable
    # no URI is appended, so the request URI (/api/..., /uploads/...) is
    # forwarded unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cms_api http://cms-api-hoshiarpur:4000;

    location /api/ {
        proxy_pass $cms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /uploads/ {
        proxy_pass $cms_api;
        proxy_set_header Host $host;
    }

    # SPA fallback — react-router client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
